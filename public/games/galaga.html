<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GALAGA</title>
<style>
  :root { --bg:#05060a; --accent:#36d6a3; --danger:#f06a8c; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: #f3f5fb;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    max-width: 100%;
    max-height: 100%;
    background: #000;
    display: block;
  }
  #soundBtn {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 5;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff;
    border-radius: 999px;
    width: 38px; height: 38px;
    font-size: 16px;
    cursor: pointer;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(2,3,6,0.85);
    text-align: center;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 24px; letter-spacing: 0.08em; }
  #overlay p { margin: 0; color: #8a90a6; font-size: 13px; }
  #overlay .big { font-size: 34px; font-weight: 900; color: var(--accent); }
  #overlay button {
    margin-top: 6px;
    padding: 10px 22px;
    border: none;
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    background: var(--accent);
    color: #04140f;
  }
  #hint {
    position: absolute;
    bottom: 8px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: #6b7284;
    z-index: 4;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="420" height="620"></canvas>
  <button id="soundBtn" title="사운드 on/off">🔊</button>
  <div id="overlay">
    <h2 id="overlayTitle">PAUSED</h2>
    <p id="overlaySub">P 키를 눌러 계속하세요</p>
    <div class="big" id="overlayScore" style="display:none;">0</div>
    <button id="overlayBtn" style="display:none;">다시 시작</button>
  </div>
  <div id="hint">← → 이동 · Space 발사 · P 일시정지</div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayScore = document.getElementById('overlayScore');
  const overlayBtn = document.getElementById('overlayBtn');
  const soundBtn = document.getElementById('soundBtn');

  // ---------- 사운드 (Web Audio, 오실레이터 기반 — 외부 파일 없음) ----------
  let actx = null, soundOn = true;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, duration, type, volume) {
    if (!soundOn || !actx) return;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = (volume != null ? volume : 0.06);
    osc.connect(gain); gain.connect(actx.destination);
    const now = actx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  }
  function sfxShoot() { beep(880, 0.08, 'square', 0.05); }
  function sfxExplode() { beep(140, 0.22, 'sawtooth', 0.08); }
  function sfxHit() { beep(90, 0.3, 'sawtooth', 0.09); }
  function sfxStageClear() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.07), i * 110));
  }
  function sfxGameOver() {
    [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.08), i * 180));
  }

  soundBtn.addEventListener('click', () => {
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
  });

  // ---------- 상태 ----------
  const ENEMY_TYPES = [
    { color: '#f06a8c', score: 30 },
    { color: '#f5b85c', score: 20 },
    { color: '#4c8dff', score: 10 },
  ];

  let player, bullets, enemyBullets, enemies, particles;
  let score, lives, stage, invuln, over, paused, running, clearing;
  let fireCooldown = 0;
  let spawnTimer = 0;
  let keys = { left: false, right: false };
  let lastTime = 0;

  function resetAll() {
    score = 0; lives = 3; stage = 1; over = false; paused = false; running = true; clearing = false;
    player = { x: W / 2, y: H - 50, w: 28, h: 22, speed: 220, invuln: 0 };
    bullets = []; enemyBullets = []; particles = [];
    buildStage();
    overlay.classList.remove('show');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function buildStage() {
    enemies = [];
    const cols = 6;
    const rows = Math.min(3 + Math.floor((stage - 1) / 2), 6);
    const gapX = 48, gapY = 38;
    const startX = (W - (cols - 1) * gapX) / 2;
    const startY = 70;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const typeIdx = r === 0 ? 0 : r < 2 ? 1 : 2;
        enemies.push({
          col: c, row: r,
          baseX: startX + c * gapX, baseY: startY + r * gapY,
          x: startX + c * gapX, y: startY + r * gapY,
          type: typeIdx, alive: true, state: 'formation',
          diveT: 0, diveSeed: Math.random() * 10,
        });
      }
    }
    spawnTimer = 0;
  }

  function endGame() {
    over = true; running = false;
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.textContent = '최종 점수';
    overlayScore.style.display = 'block';
    overlayScore.textContent = score;
    overlayBtn.style.display = 'inline-block';
    overlayBtn.textContent = '다시 시작';
    overlay.classList.add('show');
    sfxGameOver();
  }

  function togglePause() {
    if (over || clearing) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = 'PAUSED';
      overlaySub.textContent = 'P 키를 눌러 계속하세요';
      overlayScore.style.display = 'none';
      overlayBtn.style.display = 'none';
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  }

  function nextStage() {
    clearing = true;
    sfxStageClear();
    setTimeout(() => {
      stage++;
      buildStage();
      clearing = false;
    }, 1200);
  }

  // ---------- 입력 ----------
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', ' ', 'Spacebar', 'p', 'P'].includes(e.key)) e.preventDefault();
    ensureAudio();
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if ((e.key === ' ' || e.key === 'Spacebar') && !over && !paused && !clearing) fire();
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  overlayBtn.addEventListener('click', () => {
    if (over) resetAll();
  });

  function fire() {
    if (fireCooldown > 0) return;
    fireCooldown = 0.22;
    bullets.push({ x: player.x, y: player.y - player.h / 2, w: 3, h: 12, speed: 420 });
    sfxShoot();
  }

  // ---------- 업데이트 ----------
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 90;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4, color });
    }
  }

  function update(dt) {
    if (paused || over || clearing) return;

    fireCooldown = Math.max(0, fireCooldown - dt);
    if (player.invuln > 0) player.invuln -= dt;

    if (keys.left) player.x -= player.speed * dt;
    if (keys.right) player.x += player.speed * dt;
    player.x = Math.max(player.w / 2 + 6, Math.min(W - player.w / 2 - 6, player.x));

    bullets.forEach((b) => (b.y -= b.speed * dt));
    bullets = bullets.filter((b) => b.y > -20);

    enemyBullets.forEach((b) => (b.y += b.speed * dt));
    enemyBullets = enemyBullets.filter((b) => b.y < H + 20);

    particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    particles = particles.filter((p) => p.life > 0);

    const t = performance.now() / 1000;
    const formationAmp = 46;
    const formationSpeed = 1.1 + stage * 0.07;
    const offsetX = Math.sin(t * formationSpeed) * formationAmp;

    const aliveFormation = enemies.filter((en) => en.alive && en.state === 'formation');

    spawnTimer -= dt;
    if (spawnTimer <= 0 && aliveFormation.length > 0) {
      spawnTimer = Math.max(0.6, 2.4 - stage * 0.15);
      const diver = aliveFormation[Math.floor(Math.random() * aliveFormation.length)];
      diver.state = 'diving';
      diver.diveT = 0;
    }

    const diveSpeed = 0.5 + stage * 0.05;
    enemies.forEach((en) => {
      if (!en.alive) return;
      if (en.state === 'formation') {
        en.x = en.baseX + offsetX;
        en.y = en.baseY;
        if (Math.random() < 0.0025 * stage) {
          enemyBullets.push({ x: en.x, y: en.y + 10, w: 3, h: 10, speed: 160 + stage * 10 });
        }
      } else if (en.state === 'diving') {
        en.diveT += dt * diveSpeed;
        const swirl = Math.sin(en.diveT * 3 + en.diveSeed) * 70;
        en.x = en.baseX + offsetX + swirl;
        en.y = en.baseY + en.diveT * 160;
        if (Math.random() < 0.01) {
          enemyBullets.push({ x: en.x, y: en.y + 10, w: 3, h: 10, speed: 200 + stage * 10 });
        }
        if (en.y > H + 30) {
          en.state = 'returning';
          en.y = -30;
          en.x = en.baseX;
        }
      } else if (en.state === 'returning') {
        en.y += 220 * dt;
        en.x += (en.baseX - en.x) * Math.min(1, dt * 2);
        if (en.y >= en.baseY) {
          en.state = 'formation';
          en.y = en.baseY;
        }
      }
    });

    // 충돌: 플레이어 총알 vs 적
    for (const b of bullets) {
      for (const en of enemies) {
        if (!en.alive) continue;
        if (Math.abs(b.x - en.x) < 16 && Math.abs(b.y - en.y) < 14) {
          en.alive = false;
          b.y = -999;
          score += ENEMY_TYPES[en.type].score;
          spawnParticles(en.x, en.y, ENEMY_TYPES[en.type].color);
          sfxExplode();
        }
      }
    }
    bullets = bullets.filter((b) => b.y > -900);

    // 충돌: 적 총알 vs 플레이어
    if (player.invuln <= 0) {
      for (const b of enemyBullets) {
        if (Math.abs(b.x - player.x) < 16 && Math.abs(b.y - player.y) < 14) {
          b.y = H + 999;
          hitPlayer();
          break;
        }
      }
      enemyBullets = enemyBullets.filter((b) => b.y < H + 900);
    }

    // 적 vs 플레이어 (다이빙 중 충돌)
    if (player.invuln <= 0) {
      for (const en of enemies) {
        if (!en.alive) continue;
        if (Math.abs(en.x - player.x) < 18 && Math.abs(en.y - player.y) < 16) {
          en.alive = false;
          spawnParticles(en.x, en.y, ENEMY_TYPES[en.type].color);
          hitPlayer();
          break;
        }
      }
    }

    if (enemies.every((en) => !en.alive) && !clearing) {
      nextStage();
    }
  }

  function hitPlayer() {
    lives--;
    player.invuln = 1.4;
    spawnParticles(player.x, player.y, '#4c8dff');
    sfxHit();
    if (lives <= 0) endGame();
  }

  // ---------- 렌더 ----------
  function drawStars() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    const t = performance.now() / 1000;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 60; i++) {
      const x = (i * 97) % W;
      const y = ((i * 53 + t * 40) % H);
      ctx.globalAlpha = 0.3 + (i % 5) * 0.12;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    if (player.invuln > 0 && Math.floor(performance.now() / 90) % 2 === 0) return;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#4cff8f';
    ctx.beginPath();
    ctx.moveTo(0, -player.h / 2);
    ctx.lineTo(player.w / 2, player.h / 2);
    ctx.lineTo(0, player.h / 3);
    ctx.lineTo(-player.w / 2, player.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#36d6a3';
    ctx.fillRect(-3, -player.h / 2 + 4, 6, 10);
    ctx.restore();
  }

  function drawEnemy(en) {
    const color = ENEMY_TYPES[en.type].color;
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.lineTo(-5, -9);
    ctx.lineTo(5, -9);
    ctx.lineTo(12, 0);
    ctx.lineTo(5, 9);
    ctx.lineTo(-5, 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(-3, -3, 6, 6);
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = '#f3f5fb';
    ctx.font = 'bold 14px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, 20);
    ctx.textAlign = 'right';
    ctx.fillText('STAGE ' + stage, W - 10, 20);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f06a8c';
    for (let i = 0; i < lives; i++) {
      ctx.fillText('▲', 10 + i * 18, 40);
    }
    if (clearing) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#36d6a3';
      ctx.font = 'bold 20px -apple-system, sans-serif';
      ctx.fillText('STAGE ' + stage + ' CLEAR', W / 2, H / 2);
    }
  }

  function draw() {
    drawStars();
    bullets.forEach((b) => { ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12); });
    enemyBullets.forEach((b) => { ctx.fillStyle = '#f5b85c'; ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10); });
    enemies.forEach((en) => { if (en.alive) drawEnemy(en); });
    particles.forEach((p) => {
      ctx.globalAlpha = Math.max(0, p.life / 0.4);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      ctx.globalAlpha = 1;
    });
    drawPlayer();
    drawHUD();
  }

  function loop(time) {
    if (!running) return;
    const dt = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resetAll();
})();
</script>
</body>
</html>
