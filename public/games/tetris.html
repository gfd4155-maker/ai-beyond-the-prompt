<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TETRIS</title>
<style>
  :root {
    --bg: #0a0c12;
    --panel: #11141d;
    --panel-2: #171b27;
    --border: rgba(255,255,255,0.12);
    --text: #f3f5fb;
    --text-dim: #8a90a6;
    --accent: #4c8dff;
    --accent-2: #36d6a3;
    --danger: #f06a8c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    height: 100%;
    padding: 16px;
  }
  .board-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #board {
    background: #000;
    border: 2px solid var(--border);
    border-radius: 8px;
    display: block;
  }
  .panel {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  #nextCanvas {
    display: block;
    margin: 0 auto;
    background: #000;
    border-radius: 6px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
  }
  .stat-row b { color: var(--accent-2); font-size: 15px; }
  .controls-list {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
  }
  button.btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    background: var(--accent);
    color: #0a0c12;
  }
  button.btn.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5,6,10,0.88);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 22px; }
  .overlay p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .overlay .score-big { font-size: 32px; font-weight: 900; color: var(--accent-2); }
</style>
</head>
<body>
<div id="app">
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div id="pauseOverlay" class="overlay">
      <h2>일시정지</h2>
      <p>P 또는 재개 버튼을 눌러 계속하세요</p>
    </div>
    <div id="gameOverOverlay" class="overlay">
      <h2>게임 오버</h2>
      <p>최종 점수</p>
      <div class="score-big" id="finalScore">0</div>
      <button class="btn" id="restartBtn">다시 시작</button>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <h3>다음 블록</h3>
      <canvas id="nextCanvas" width="96" height="96"></canvas>
    </div>
    <div class="card">
      <h3>현황</h3>
      <div class="stat-row"><span>점수</span><b id="scoreVal">0</b></div>
      <div class="stat-row"><span>레벨</span><b id="levelVal">1</b></div>
      <div class="stat-row"><span>줄 수</span><b id="linesVal">0</b></div>
    </div>
    <div class="card">
      <h3>조작법</h3>
      <ul class="controls-list">
        <li>← → : 이동</li>
        <li>↑ : 회전</li>
        <li>↓ : 소프트 드롭</li>
        <li>Space : 하드 드롭</li>
        <li>P : 일시정지</li>
      </ul>
    </div>
    <button class="btn secondary" id="pauseBtn">일시정지</button>
    <button class="btn secondary" id="restartBtn2">다시 시작</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const COLS = 10, ROWS = 20;
  let CELL = 28;

  const COLORS = {
    I: '#36d6a3', O: '#f5b85c', T: '#9d7bff', S: '#4cff8f',
    Z: '#f06a8c', J: '#4c8dff', L: '#ff9a4c'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const PIECE_KEYS = Object.keys(SHAPES);

  function rotateCells(cells) {
    // 4x4 박스 기준 시계방향 회전: (x,y) -> (3-y, x)
    return cells.map(([x, y]) => [3 - y, x]);
  }

  function makePiece(key) {
    return { key, cells: SHAPES[key].map((c) => c.slice()), x: 3, y: -1, color: COLORS[key] };
  }

  function randomKey() {
    return PIECE_KEYS[Math.floor(Math.random() * PIECE_KEYS.length)];
  }

  let grid, current, next, score, level, lines, dropInterval, dropTimer, lastTime;
  let paused = false, over = false, running = false;
  let softDrop = false;

  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('scoreVal');
  const levelEl = document.getElementById('levelVal');
  const linesEl = document.getElementById('linesVal');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  function levelSpeed(lv) {
    return Math.max(100, 800 - (lv - 1) * 60);
  }

  function resize() {
    const maxBoardH = Math.min(window.innerHeight - 40, 760);
    CELL = Math.floor(maxBoardH / ROWS);
    if (CELL < 14) CELL = 14;
    boardCanvas.width = COLS * CELL;
    boardCanvas.height = ROWS * CELL;
    draw();
  }

  function newGrid() {
    const g = [];
    for (let y = 0; y < ROWS; y++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function resetGame() {
    grid = newGrid();
    score = 0; level = 1; lines = 0;
    dropInterval = levelSpeed(level);
    current = makePiece(randomKey());
    next = makePiece(randomKey());
    over = false; paused = false; running = true;
    gameOverOverlay.classList.remove('show');
    pauseOverlay.classList.remove('show');
    updateHUD();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function cellsAbs(piece) {
    return piece.cells.map(([x, y]) => [piece.x + x, piece.y + y]);
  }

  function collides(piece, dx, dy, cells) {
    const test = (cells || piece.cells).map(([x, y]) => [piece.x + x + dx, piece.y + y + dy]);
    for (const [x, y] of test) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    const abs = cellsAbs(current);
    for (const [x, y] of abs) {
      if (y >= 0) grid[y][x] = current.color;
    }
    clearLines();
    current = next;
    next = makePiece(randomKey());
    if (collides(current, 0, 0)) {
      endGame();
    }
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every((c) => c)) {
        grid.splice(y, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const table = [0, 100, 300, 500, 800];
      score += (table[cleared] || 800) * level;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level) {
        level = newLevel;
        dropInterval = levelSpeed(level);
      }
      updateHUD();
    }
  }

  function endGame() {
    over = true; running = false;
    finalScoreEl.textContent = score;
    gameOverOverlay.classList.add('show');
  }

  function tryMove(dx, dy) {
    if (over || paused) return false;
    if (!collides(current, dx, dy)) {
      current.x += dx; current.y += dy;
      return true;
    }
    if (dy > 0) {
      lockPiece();
    }
    return false;
  }

  function tryRotate() {
    if (over || paused) return;
    const rotated = rotateCells(current.cells);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(current, k, 0, rotated)) {
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function hardDrop() {
    if (over || paused) return;
    let dist = 0;
    while (!collides(current, 0, dist + 1)) dist++;
    current.y += dist;
    score += dist * 2;
    lockPiece();
    updateHUD();
  }

  function togglePause() {
    if (over) return;
    paused = !paused;
    pauseOverlay.classList.toggle('show', paused);
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, grid[y][x], CELL);
      }
    }

    if (current) {
      for (const [x, y] of cellsAbs(current)) {
        if (y >= 0) drawCell(ctx, x, y, current.color, CELL);
      }
    }

    nctx.fillStyle = '#000';
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (next) {
      const nc = 20;
      const offX = (nextCanvas.width - 4 * nc) / 2;
      const offY = (nextCanvas.height - 4 * nc) / 2;
      for (const [x, y] of next.cells) {
        nctx.fillStyle = next.color;
        nctx.fillRect(offX + x * nc + 1, offY + y * nc + 1, nc - 2, nc - 2);
      }
    }
  }

  function drawCell(c, x, y, color, size) {
    c.fillStyle = color;
    c.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    c.fillStyle = 'rgba(255,255,255,0.25)';
    c.fillRect(x * size + 1, y * size + 1, size - 2, 3);
  }

  function loop(time) {
    if (!running) return;
    const dt = time - lastTime;
    lastTime = time;
    if (!paused && !over) {
      dropTimer = (dropTimer || 0) + dt;
      const interval = softDrop ? Math.min(dropInterval, 50) : dropInterval;
      if (dropTimer > interval) {
        dropTimer = 0;
        tryMove(0, 1);
        updateHUD();
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Spacebar', 'p', 'P'].includes(e.key)) {
      e.preventDefault();
    }
    if (over) return;
    switch (e.key) {
      case 'ArrowLeft': tryMove(-1, 0); break;
      case 'ArrowRight': tryMove(1, 0); break;
      case 'ArrowUp': tryRotate(); break;
      case 'ArrowDown': softDrop = true; break;
      case ' ':
      case 'Spacebar': hardDrop(); break;
      case 'p':
      case 'P': togglePause(); break;
    }
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowDown') softDrop = false;
  });

  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', resetGame);
  document.getElementById('restartBtn2').addEventListener('click', resetGame);

  window.addEventListener('resize', resize);

  resetGame();
  resize();
})();
</script>
</body>
</html>
